services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: dev_local_only_changeme
      POSTGRES_DB: marketplace
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace']
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    ports:
      - '6432:6432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432']
      interval: 5s
      timeout: 3s
      retries: 10

  # Pact Broker (hw-16): where contracts and verification results live so
  # can-i-deploy has something to answer. Its own Postgres is internal-only —
  # nothing outside the broker talks to broker-db directly.
  broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_DB: broker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U broker -d broker']
      interval: 2s
      timeout: 2s
      retries: 15

  broker:
    image: pactfoundation/pact-broker:2.142.0-pactbroker2.120.0
    ports:
      - '9292:9292'
    environment:
      PACT_BROKER_DATABASE_URL: postgres://broker:broker@broker-db/broker
      PACT_BROKER_ALLOW_PUBLIC_READ: 'true'
    depends_on:
      broker-db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost can resolve
      # to ::1, and puma only listens on IPv4.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat']
      interval: 3s
      timeout: 3s
      retries: 30

  rabbitmq:
    # 4.2.x is the LTS line (support until 2030-06-30); 4.3 is the current one
    image: rabbitmq:4.2.9-management-alpine
    # quorum queue data is tied to the node name, which comes from the
    # hostname — a random one would orphan the volume on every recreate
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: marketplace
      RABBITMQ_DEFAULT_PASS: dev_local_only_changeme
    ports:
      - '5672:5672'   # AMQP
      - '15672:15672' # management UI, look at x-death here
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      # an open port isn't readiness: the Erlang node accepts TCP before it
      # accepts basic.publish, and clients in that window get ECONNRESET
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity']
      interval: 5s
      start_period: 40s
      timeout: 10s
      retries: 10

  # Two Redis on purpose (hw-23). The cache needs maxmemory + allkeys-lru,
  # BullMQ needs noeviction: it "cannot work properly if Redis evicts keys
  # arbitrarily". maxmemory-policy is one per process, SELECT 1 doesn't
  # split it, so it's two containers.
  redis-cache:
    image: redis:8.4.7-alpine
    # small on purpose, demo:cache fills it to watch LRU work; no
    # persistence, a cache that comes back empty is still correct
    command: ['redis-server', '--maxmemory', '32mb', '--maxmemory-policy', 'allkeys-lru', '--save', '', '--appendonly', 'no']
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  # BullMQ jobs and sessions: nothing here may be evicted or lost on restart.
  # A full instance fails writes loudly instead of dropping a job.
  redis-queue:
    image: redis:8.4.7-alpine
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '6381:6379'
    volumes:
      - redisqueue:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  # S3-compatible object storage for hw-26. MinIO stopped publishing images in
  # 2025; this is Bitnami's archived build of the 2025-07-23 release, pinned.
  # Where this homework looks it behaves like S3: SigV4 is checked, anonymous
  # and expired requests get 403, parts below 5 MiB are refused. Dev
  # credentials, same as the database passwords above.
  storage:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: marketplace
      MINIO_ROOT_PASSWORD: dev_local_only_changeme
      MINIO_DEFAULT_BUCKETS: marketplace-files
    ports:
      - '9900:9000' # S3 API
    # every `down` leaves a clean slate; 1g so a demo series never runs out of room
    tmpfs:
      - /bitnami/minio/data:size=1g
    healthcheck:
      # healthy once the bucket exists, not merely when the server answers
      test: ['CMD-SHELL', 'mc alias set local http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc ls local/marketplace-files >/dev/null 2>&1']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  rabbitdata:
  redisqueue:
