[databases]
marketplace = host=postgres port=5432 dbname=marketplace

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
default_pool_size = 5
max_client_conn = 200

; 0 у transaction mode ламає іменовані prepared statements, з 1.21 їх можна трекати
max_prepared_statements = 200

admin_users = marketplace
stats_users = marketplace

; node-pg / psql шлють цей параметр на старті, PgBouncer його не знає
ignore_startup_parameters = extra_float_digits
